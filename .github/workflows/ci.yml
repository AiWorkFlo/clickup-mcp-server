name: AiWorkFlo CI
on:
  pull_request:
  push:
    branches: [main, deploy/aiworkflo-render]
permissions:
  contents: read
jobs:
  test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: team_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: team_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U team_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEAM_TEST_DATABASE_URL: postgres://team_test:test_only@localhost:5432/team_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: node scripts/render-build.mjs
      - run: npm audit --omit=dev --audit-level=high
